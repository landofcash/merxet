[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# One writer per Bunny prefix. Stop the previous coordinator BEFORE starting its
# replacement. A single replica or zero traffic overlap alone does not enforce this.
# The hosted service mounts /coordinator and requires its actual volume at startup.
